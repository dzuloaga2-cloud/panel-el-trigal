<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Panel El Trigal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna para teléfono, barra inferior de navegación, tarjetas sólo donde hay un objeto real */
:root{
  --bg:#F3F5EF; --surface:#FFFFFF; --ink:#1B2620; --muted:#5F6E66; --line:#DCE2D9;
  --accent:#2E6B57; --accent-ink:#FFFFFF; --wheat:#B87A12; --wheat-soft:#F6EBD3;
  --ok:#2E7D4F; --warn:#B26A00; --crit:#B3261E; --crit-soft:#FBE7E5; --ok-soft:#E3F1E8;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1B2420; --ink:#E7EDE8; --muted:#9AA9A1; --line:#2C3832;
  --accent:#6FC2A3; --accent-ink:#0E1A15; --wheat:#E3A93D; --wheat-soft:#3A2E17;
  --ok:#6FCF97; --warn:#F2B451; --crit:#F28B82; --crit-soft:#3B2220; --ok-soft:#1F3328; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1B2420; --ink:#E7EDE8; --muted:#9AA9A1; --line:#2C3832;
  --accent:#6FC2A3; --accent-ink:#0E1A15; --wheat:#E3A93D; --wheat-soft:#3A2E17;
  --ok:#6FCF97; --warn:#F2B451; --crit:#F28B82; --crit-soft:#3B2220; --ok-soft:#1F3328; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--wheat-soft);display:grid;place-items:center;flex:none}
.brand h1{font-family:var(--display);font-weight:800;font-size:20px;margin:0;line-height:1.1;text-wrap:balance}
.brand small{color:var(--muted);font-size:12.5px;display:block}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--wheat);background:var(--wheat-soft);padding:4px 8px;border-radius:999px;white-space:nowrap}
h2{font-family:var(--display);font-weight:700;font-size:17px;margin:0}
.label{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero .label{color:inherit;opacity:.8}
.big{font-family:var(--display);font-weight:800;font-size:38px;line-height:1}
.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero-row div{display:flex;flex-direction:column;gap:2px}
.hero-row strong{font-family:var(--display);font-size:20px}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--accent-ink) 25%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent-ink);border-radius:99px;transition:width .4s}
.section{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.chart svg{width:100%;height:auto;display:block}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--crit-soft);color:var(--crit);font-weight:600;font-size:14px}
.alert span:last-child{font-weight:500;white-space:nowrap}
.okbox{padding:10px 12px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:14px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:600}
.row .main span{color:var(--muted);font-size:13px}
.row .amt{font-weight:700;white-space:nowrap}
.chip{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.low{background:var(--crit-soft);color:var(--crit)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.vip{background:var(--wheat-soft);color:var(--wheat)}
.grid-prod{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative}
.prod b{font-weight:600}
.prod span{color:var(--muted);font-size:13px}
.prod .q{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 6px}
.prod:active{transform:scale(.98)}
.prod[disabled]{opacity:.45;cursor:not-allowed}
button,select,input{font:inherit}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.prod:focus-visible,.nav button:focus-visible,.step:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--wheat);outline-offset:2px}
.cart{position:sticky;bottom:84px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 24px color-mix(in srgb,var(--ink) 12%,transparent)}
.cart-line{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cart-line strong{font-family:var(--display);font-size:24px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.form{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;gap:6px}
.step{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer}
.stock{min-width:34px;text-align:center;font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-top:8px;z-index:5}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:6px 0;border-radius:10px;cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.foot{color:var(--muted);font-size:12.5px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.foot button{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}
.muted{color:var(--muted);font-size:13.5px;margin:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 21V8" stroke="var(--wheat)" stroke-width="2" stroke-linecap="round"/><path d="M12 9c-2.5 0-4-1.8-4-4 2.5 0 4 1.8 4 4Zm0 0c2.5 0 4-1.8 4-4-2.5 0-4 1.8-4 4Zm0 5c-2.5 0-4-1.8-4-4 2.5 0 4 1.8 4 4Zm0 0c2.5 0 4-1.8 4-4-2.5 0-4 1.8-4 4Zm0 5c-2.5 0-4-1.8-4-4 2.5 0 4 1.8 4 4Zm0 0c2.5 0 4-1.8 4-4-2.5 0-4 1.8-4 4Z" fill="var(--wheat)"/></svg>
      </div>
      <div><h1>El Trigal</h1><small>Panadería y almacén · panel de gestión</small></div>
    </div>
    <span class="tag">Demo</span>
  </header>
  <main id="view"></main>
  <div class="foot">
    <span>App de ejemplo con datos ficticios, construida en vivo con Claude.<br>Lo que registres queda guardado solo en tu teléfono.</span>
    <button id="reset" type="button">Restablecer datos de ejemplo</button>
  </div>
</div>

<nav class="nav" aria-label="Secciones">
  <div>
    <button data-tab="inicio" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Indicadores</button>
    <button data-tab="vender" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h11L21 8H6.2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>Vender</button>
    <button data-tab="clientes" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7M16 4a4 4 0 0 1 0 8M22 21c0-3-1.8-5.5-4.5-6.5"/></svg>Clientes</button>
    <button data-tab="inventario" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>Inventario</button>
  </div>
</nav>
<div id="toast" class="toast" hidden></div>

<script>
const KEY='eltrigal-demo-v1';
const clp=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n);
const META_SEMANAL=1200000;

function seed(){
  const products=[
    {id:'p1',name:'Marraqueta (kg)',price:2400,stock:18,min:8},
    {id:'p2',name:'Hallulla (kg)',price:2400,stock:6,min:8},
    {id:'p3',name:'Pan amasado (6 un.)',price:2500,stock:14,min:5},
    {id:'p4',name:'Empanada de pino',price:2200,stock:22,min:10},
    {id:'p5',name:'Kuchen de manzana',price:9900,stock:3,min:4},
    {id:'p6',name:'Café de grano 250 g',price:6500,stock:12,min:4},
    {id:'p7',name:'Leche entera 1 L',price:1290,stock:30,min:12},
    {id:'p8',name:'Queso gauda 250 g',price:3990,stock:9,min:5}
  ];
  const clients=[
    {id:'c1',name:'María Fuentes',phone:'+56 9 5123 4410'},
    {id:'c2',name:'Jorge Muñoz',phone:'+56 9 7731 0287'},
    {id:'c3',name:'Camila Rojas',phone:'+56 9 6620 1945'},
    {id:'c4',name:'Pedro Soto',phone:'+56 9 8102 5530'},
    {id:'c5',name:'Valentina Díaz',phone:'+56 9 9345 7712'}
  ];
  // Historial de 7 días generado de forma determinista
  let s=7; const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
  const sales=[]; const now=new Date();
  for(let d=6;d>=0;d--){
    const n=d===0?6:9+Math.floor(rnd()*7);
    for(let k=0;k<n;k++){
      const ts=new Date(now); ts.setDate(now.getDate()-d); ts.setHours(8+Math.floor(rnd()*11),Math.floor(rnd()*60),0,0);
      if(d===0 && ts>now) ts.setTime(now.getTime()-(k+1)*20*60000);
      const items=[]; const lines=1+Math.floor(rnd()*3);
      for(let l=0;l<lines;l++){const p=products[Math.floor(rnd()*products.length)];const ex=items.find(i=>i.pid===p.id);ex?ex.q++:items.push({pid:p.id,q:1+Math.floor(rnd()*2)})}
      const total=items.reduce((a,i)=>a+products.find(p=>p.id===i.pid).price*i.q,0);
      const cliente=rnd()<.55?clients[Math.floor(rnd()*clients.length)].id:'';
      sales.push({id:'s'+d+'-'+k,ts:ts.getTime(),items,total,cliente});
    }
  }
  return {products,clients,sales};
}

let state;
function load(){try{const r=localStorage.getItem(KEY);if(r){state=JSON.parse(r);return}}catch(e){} state=seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
load();

let tab='inicio'; let cart={}; let cartClient='';
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2200)}
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
const prod=id=>state.products.find(p=>p.id===id);
const cli=id=>state.clients.find(c=>c.id===id);

function renderInicio(){
  const today=dayKey(Date.now());
  const hoy=state.sales.filter(s=>dayKey(s.ts)===today);
  const totalHoy=hoy.reduce((a,s)=>a+s.total,0);
  const ticket=hoy.length?Math.round(totalHoy/hoy.length):0;
  // últimos 7 días
  const days=[];for(let d=6;d>=0;d--){const dt=new Date();dt.setDate(dt.getDate()-d);days.push({k:dayKey(dt.getTime()),lbl:dt.toLocaleDateString('es-CL',{weekday:'short'}).replace('.',''),v:0})}
  state.sales.forEach(s=>{const x=days.find(d=>d.k===dayKey(s.ts));if(x)x.v+=s.total});
  const semana=days.reduce((a,d)=>a+d.v,0);
  const pct=Math.min(100,Math.round(semana/META_SEMANAL*100));
  // top producto semana
  const cnt={};state.sales.forEach(s=>s.items.forEach(i=>cnt[i.pid]=(cnt[i.pid]||0)+i.q));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const bajos=state.products.filter(p=>p.stock<=p.min);
  // gráfico
  const W=320,H=150,P=24,max=Math.max(...days.map(d=>d.v),1);
  const niceMax=Math.ceil(max/100000)*100000;
  const bw=(W-P*2)/days.length;
  const bars=days.map((d,i)=>{const h=(d.v/niceMax)*(H-P*2);const x=P+i*bw+bw*.18;const y=H-P-h;const last=i===days.length-1;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="5" fill="${last?'var(--wheat)':'var(--accent)'}" opacity="${last?1:.75}"/>
    <text x="${(x+bw*.32).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Figtree,system-ui">${d.lbl}</text>`}).join('');
  const grid=[0,.5,1].map(f=>{const y=H-P-f*(H-P*2);return `<line x1="${P}" x2="${W-P}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P-4}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Figtree,system-ui">${f?Math.round(niceMax*f/1000)+'k':'0'}</text>`}).join('');
  const recientes=[...state.sales].sort((a,b)=>b.ts-a.ts).slice(0,5);
  return `
  <div class="section" style="gap:18px">
    <section class="hero" aria-label="Resumen de hoy">
      <div><div class="label">Ventas de hoy</div><div class="big">${clp(totalHoy)}</div></div>
      <div class="hero-row">
        <div><span class="label">N.º de ventas</span><strong>${hoy.length}</strong></div>
        <div><span class="label">Ticket promedio</span><strong>${clp(ticket)}</strong></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;gap:8px"><span class="label">Meta semanal ${clp(META_SEMANAL)}</span><strong>${pct}%</strong></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
      </div>
    </section>
    <section class="section">
      <h2>Ventas últimos 7 días</h2>
      <div class="panel chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por día">${grid}${bars}</svg>
      <p class="muted">Semana: <b>${clp(semana)}</b>${top?` · Más vendido: <b>${esc(prod(top[0]).name)}</b>`:''}</p></div>
    </section>
    <section class="section">
      <h2>Alertas de inventario</h2>
      <div class="alerts">${bajos.length?bajos.map(p=>`<div class="alert"><span>${esc(p.name)}</span><span>quedan ${p.stock} · mín. ${p.min}</span></div>`).join(''):'<div class="okbox">Todo el inventario está sobre el mínimo.</div>'}</div>
    </section>
    <section class="section">
      <h2>Últimas ventas</h2>
      <div class="panel list">${recientes.map(s=>`<div class="row"><div class="main"><b>${s.cliente&&cli(s.cliente)?esc(cli(s.cliente).name):'Cliente de mesón'}</b><span>${new Date(s.ts).toLocaleString('es-CL',{weekday:'short',hour:'2-digit',minute:'2-digit'})} · ${s.items.reduce((a,i)=>a+i.q,0)} productos</span></div><span class="amt">${clp(s.total)}</span></div>`).join('')}</div>
    </section>
  </div>`;
}

function renderVender(){
  const total=Object.entries(cart).reduce((a,[pid,q])=>a+prod(pid).price*q,0);
  const n=Object.values(cart).reduce((a,b)=>a+b,0);
  return `
  <div class="section" style="gap:14px">
    <div><h2>Nueva venta</h2><p class="muted">Toca un producto para agregarlo. El stock se descuenta al registrar.</p></div>
    <div class="grid-prod">${state.products.map(p=>`<button type="button" class="prod" data-add="${p.id}" ${p.stock-(cart[p.id]||0)<=0?'disabled':''}>
      ${cart[p.id]?`<span class="q">${cart[p.id]}</span>`:''}
      <b>${esc(p.name)}</b><span>${clp(p.price)} · stock ${p.stock}</span></button>`).join('')}</div>
    <div class="cart">
      <div class="field"><label for="cartClient">Cliente (opcional)</label>
        <select id="cartClient"><option value="">Cliente de mesón</option>${state.clients.map(c=>`<option value="${c.id}" ${c.id===cartClient?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div class="cart-line"><span class="muted">${n} producto${n===1?'':'s'}</span><strong>${clp(total)}</strong></div>
      <div class="two"><button type="button" class="btn ghost" id="clearCart" ${n?'':'disabled'}>Vaciar</button><button type="button" class="btn" id="checkout" ${n?'':'disabled'}>Registrar venta</button></div>
    </div>
  </div>`;
}

function renderClientes(){
  const stats=c=>{const v=state.sales.filter(s=>s.cliente===c.id);return {n:v.length,t:v.reduce((a,s)=>a+s.total,0),last:v.length?Math.max(...v.map(s=>s.ts)):0}};
  const list=state.clients.map(c=>({...c,...stats(c)})).sort((a,b)=>b.t-a.t);
  return `
  <div class="section" style="gap:14px">
    <div><h2>Clientes</h2><p class="muted">${list.length} registrados · ordenados por monto comprado esta semana.</p></div>
    <div class="panel list">${list.map(c=>`<div class="row"><div class="main"><b>${esc(c.name)}</b><span>${esc(c.phone)} · ${c.n} compra${c.n===1?'':'s'}${c.last?' · última '+new Date(c.last).toLocaleDateString('es-CL',{weekday:'short',day:'numeric'}):''}</span></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="amt">${clp(c.t)}</span>${c.n>=5?'<span class="chip vip">Frecuente</span>':c.n===0?'<span class="chip low">Sin compras</span>':''}</div></div>`).join('')}</div>
    <form class="panel form" id="addClient">
      <h2>Agregar cliente</h2>
      <div class="field"><label for="cName">Nombre</label><input id="cName" required placeholder="Ej.: Ana Pérez" autocomplete="off"></div>
      <div class="field"><label for="cPhone">Teléfono</label><input id="cPhone" inputmode="tel" placeholder="+56 9 ..." autocomplete="off"></div>
      <button class="btn" type="submit">Guardar cliente</button>
    </form>
  </div>`;
}

function renderInventario(){
  const valor=state.products.reduce((a,p)=>a+p.price*p.stock,0);
  return `
  <div class="section" style="gap:14px">
    <div><h2>Inventario</h2><p class="muted">Valor del stock a precio de venta: <b>${clp(valor)}</b>. Usa + y − para ajustar tras una recepción o un conteo.</p></div>
    <div class="panel list">${state.products.map(p=>`<div class="row"><div class="main"><b>${esc(p.name)}</b><span>${clp(p.price)} · mín. ${p.min} ${p.stock<=p.min?'<span class="chip low">Reponer</span>':'<span class="chip ok">OK</span>'}</span></div>
      <div class="stepper"><button type="button" class="step" data-dec="${p.id}" aria-label="Restar 1 a ${esc(p.name)}">−</button><span class="stock">${p.stock}</span><button type="button" class="step" data-inc="${p.id}" aria-label="Sumar 1 a ${esc(p.name)}">+</button></div></div>`).join('')}</div>
  </div>`;
}

function render(){
  const v={inicio:renderInicio,vender:renderVender,clientes:renderClientes,inventario:renderInventario}[tab]();
  $('#view').innerHTML=v;
  document.querySelectorAll('.nav button').forEach(b=>b.dataset.tab===tab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);try{localStorage.setItem(KEY+'-tab',tab)}catch(_){};return}
  if(t.dataset.add){const p=prod(t.dataset.add);if((cart[p.id]||0)<p.stock){cart[p.id]=(cart[p.id]||0)+1;render()}return}
  if(t.id==='clearCart'){cart={};render();return}
  if(t.id==='checkout'){
    const items=Object.entries(cart).map(([pid,q])=>({pid,q}));
    const total=items.reduce((a,i)=>a+prod(i.pid).price*i.q,0);
    items.forEach(i=>prod(i.pid).stock-=i.q);
    state.sales.push({id:'s'+Date.now(),ts:Date.now(),items,total,cliente:cartClient});
    cart={};cartClient='';save();
    const bajos=items.map(i=>prod(i.pid)).filter(p=>p.stock<=p.min);
    tab='inicio';render();window.scrollTo(0,0);
    toast('Venta registrada: '+clp(total)+(bajos.length?' · revisa stock de '+bajos[0].name:''));return}
  if(t.dataset.inc||t.dataset.dec){const p=prod(t.dataset.inc||t.dataset.dec);p.stock=Math.max(0,p.stock+(t.dataset.inc?1:-1));save();render();return}
  if(t.id==='reset'){
    if(t.dataset.confirm){try{localStorage.removeItem(KEY)}catch(_){};state=seed();cart={};tab='inicio';render();t.textContent='Restablecer datos de ejemplo';delete t.dataset.confirm;toast('Datos de ejemplo restablecidos')}
    else{t.dataset.confirm='1';t.textContent='Toca otra vez para confirmar';setTimeout(()=>{if(t.dataset.confirm){delete t.dataset.confirm;t.textContent='Restablecer datos de ejemplo'}},3500)}
  }
});
document.addEventListener('change',e=>{if(e.target.id==='cartClient')cartClient=e.target.value});
document.addEventListener('submit',e=>{
  if(e.target.id!=='addClient')return;e.preventDefault();
  const name=$('#cName').value.trim();if(!name)return;
  state.clients.push({id:'c'+Date.now(),name,phone:$('#cPhone').value.trim()||'Sin teléfono'});save();render();toast('Cliente guardado: '+name);
});
render();
</script>

</body>
